[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-media-culler"
version = "0.2.0"
description = "Score, group and cull photo collections with technical, AI and face-aware analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "opencv-python-headless>=4.9",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
# Semantic photo assessment (SigLIP zero-shot)
ai = ["torch>=2.2", "transformers>=4.40"]
# Face / eye / pose analysis (MediaPipe Face Landmarker)
faces = ["mediapipe>=0.10.14"]
all = ["ai-media-culler[ai,faces]"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "imagehash>=4.3",  # only used by the pHash parity test
]

[project.scripts]
culler = "media_culler.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
media_culler = ["data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["error::DeprecationWarning:media_culler.*"]

[tool.ruff]
line-length = 100
fix = false
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]  # typer uses function calls in defaults

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["tests/"]
